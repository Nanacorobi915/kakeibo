<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-title" content="かんたん入力">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>🐢 かんたん入力</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --txt:#eef1f6; --sub:#9aa4b2; --faint:#5a6270;
    --accent:#2b7fff; --accentDim:#22314a; --ok:#37d67a;
    --chip:#232833; --radius:16px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    max-width:520px; margin:0 auto; -webkit-user-select:none; user-select:none;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  #app{flex:1; display:flex; flex-direction:column; padding:0 18px calc(18px + env(safe-area-inset-bottom));}
  /* --- 画面遷移アニメーション ---
     方針: 画面は「横」に進む。中の要素も必ず同じ横方向へ揃える（縦の動きは使わない）。
     進む=右から入る / 戻る=左から入る。--dx が向きを一元管理する。 */
  .screen{--dx:26px; flex:1; display:flex; flex-direction:column; animation:fadeIn .2s var(--ease);}
  .screen.rev{--dx:-26px;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  @keyframes slideX{from{opacity:0; transform:translateX(var(--dx));} to{opacity:1; transform:none;}}
  @keyframes pop{0%{transform:scale(.94);} 55%{transform:scale(1.03);} 100%{transform:scale(1);}}
  @keyframes bump{0%{transform:scale(1);} 28%{transform:scale(1.07);} 100%{transform:scale(1);}}
  @keyframes draw{to{stroke-dashoffset:0;}}
  /* 画面内の各ブロックを、同じ横方向で少しずつ遅らせて立ち上げる */
  .screen .q{animation:slideX .4s .03s both var(--ease);}
  .screen .calcdisp{animation:slideX .42s .08s both var(--ease);}
  .screen .keypad{animation:slideX .44s .13s both var(--ease);}
  .screen input.item{animation:slideX .42s .08s both var(--ease);}
  .screen .foot{animation:slideX .44s .17s both var(--ease);}
  .screen .hero{animation:slideX .46s .04s both var(--ease);}
  .screen .quote{animation:slideX .5s .15s both var(--ease);}
  .screen .homeadd{animation:slideX .46s .22s both var(--ease);}
  /* --- shared --- */
  .navbar{display:flex; align-items:center; gap:10px; padding:16px 2px 6px; min-height:56px;}
  .back{width:40px; height:40px; border-radius:12px; background:var(--card); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--txt);}
  .back.hidden{visibility:hidden;}
  .steplabel{font-size:13px; color:var(--sub); font-weight:600;}
  .progress{margin-left:auto; display:flex; gap:5px; align-items:center;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--line);}
  .dot.on{background:var(--accent);}
  .dot.done{background:#3a5680;}
  .q{font-size:27px; font-weight:800; letter-spacing:.01em; margin:16px 2px 4px; text-align:center; line-height:1.25;}
  .qsub{font-size:12.5px; color:var(--sub); letter-spacing:.03em; margin:0 2px 18px; text-align:center; line-height:1.55;}
  .body{flex:1; display:flex; flex-direction:column; min-height:0; justify-content:center;}
  .foot{padding-top:12px;}
  .btn{width:100%; border:none; border-radius:16px; padding:17px; font-size:18px; font-weight:800;
    background:var(--accent); color:#fff; transition:transform .08s ease, background .12s ease;}
  .btn:active:not(:disabled){transform:scale(.98);}
  .btn:disabled{background:#333a46; color:#6b7280;}
  .btn.ok{background:var(--ok); color:#04210f;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--txt); font-weight:700;}
  .btn.ghost:active{background:var(--card);}
  .btn.compact{width:auto; padding:14px 22px; font-size:16px; border-radius:14px; flex:0 0 auto;}
  .btn.more{margin-top:14px; padding:14px; font-size:15px; font-weight:600; color:var(--sub);}
  .btn.more:active{background:var(--card); color:var(--txt);}
  .choice.newtag{border-style:dashed; color:var(--accent); background:transparent;}
  .addrow{display:flex; gap:8px; margin-top:14px;}
  .addrow input.item{flex:1; font-size:17px; padding:14px;}
  /* --- amount --- */
  .calcdisp{background:var(--card); border-radius:var(--radius); padding:14px 20px; margin:2px 0 14px;
    border:1px solid var(--line); min-height:92px; display:flex; flex-direction:column;
    justify-content:center; gap:6px;}
  .calcdisp .expr{font-size:16px; color:var(--sub); text-align:right; min-height:20px;
    word-break:break-all; font-variant-numeric:tabular-nums; letter-spacing:1px;}
  .calcdisp .res{display:flex; align-items:baseline; justify-content:flex-end; gap:6px;}
  .calcdisp .yen{font-size:22px; color:var(--sub);}
  .calcdisp .val{font-size:44px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
  .calcdisp .val.empty{color:#3a4150;}
  .keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:9px;}
  .key{background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:16px 0;
    font-size:23px; font-weight:700; display:flex; align-items:center; justify-content:center;
    transition:transform .07s ease, background .1s ease;}
  .key:active{background:#2a3140; transform:scale(.95);}
  .key.op{color:var(--accent); background:#19212f; border-color:#26344d;}
  .key.fn{color:#ffb020;}
  .key.eq{background:var(--accent); color:#fff; border-color:var(--accent); grid-row:span 2;}
  .key.zero{grid-column:span 2;}
  .key .ic{width:26px; height:26px; display:block;}
  .bump{animation:bump .2s var(--ease);}
  /* --- 記録完了の演出 --- */
  .success{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;}
  .check{width:104px; height:104px;}
  .check circle{fill:none; stroke:var(--ok); stroke-width:2.5; stroke-dasharray:151; stroke-dashoffset:151;
    animation:draw .55s var(--ease) forwards;}
  .check path{fill:none; stroke:var(--ok); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:44; stroke-dashoffset:44; animation:draw .4s .45s var(--ease) forwards;}
  .stitle{font-size:23px; font-weight:800; letter-spacing:.02em; animation:slideX .45s .5s both var(--ease);}
  .ssub{font-size:15px; color:var(--sub); font-variant-numeric:tabular-nums; animation:slideX .45s .62s both var(--ease);}
  /* --- text input --- */
  input.item{width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px;
    color:var(--txt); font-size:20px; padding:16px; outline:none; -webkit-user-select:text; user-select:text;}
  input.item:focus{border-color:var(--accent);}
  input.item::placeholder{color:var(--faint);}
  /* --- big choice chips --- */
  .choices{display:flex; flex-direction:column; gap:12px; margin-top:4px;}
  .choice{position:relative; background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 18px; font-size:19px; font-weight:700; letter-spacing:.02em; display:flex; align-items:center;
    justify-content:center; gap:11px; text-align:center; animation:slideX .44s both var(--ease);
    transition:transform .12s var(--ease), background .16s ease, border-color .16s ease;}
  .choice .ic{width:22px; height:22px; flex:0 0 auto; color:var(--c,var(--accent));
    transition:transform .18s var(--ease);}
  .choice.on .ic{transform:scale(1.12);}
  .choices.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choices.grid2 .choice{padding:19px 10px; font-size:17px;}
  .choices .choice:nth-child(1){animation-delay:.04s} .choices .choice:nth-child(2){animation-delay:.08s}
  .choices .choice:nth-child(3){animation-delay:.12s} .choices .choice:nth-child(4){animation-delay:.16s}
  .choices .choice:nth-child(5){animation-delay:.20s} .choices .choice:nth-child(6){animation-delay:.24s}
  .choices .choice:nth-child(7){animation-delay:.28s} .choices .choice:nth-child(8){animation-delay:.32s}
  .choices .choice:nth-child(9){animation-delay:.36s} .choices .choice:nth-child(10){animation-delay:.40s}
  .choices .choice:nth-child(11){animation-delay:.44s} .choices .choice:nth-child(12){animation-delay:.48s}
  .choice:active{background:var(--card2); transform:scale(.97);}
  .choice.on{background:var(--card2); border-color:var(--c,var(--accent)); animation:pop .22s var(--ease);
    box-shadow:0 0 0 1px var(--c,var(--accent)) inset;}
  .choice .tick{position:absolute; right:18px; color:var(--c,var(--accent)); font-size:20px; opacity:0;
    transform:scale(.6); transition:opacity .16s ease, transform .16s var(--ease);}
  .choice.on .tick{opacity:1; transform:scale(1);}
  /* 候補の有無でレイアウトが動かないよう高さを確保（入力枠がずれない） */
  .recents{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; justify-content:center;
    align-content:flex-start; min-height:88px;}
  .rchip{background:var(--chip); border:1px solid var(--line); border-radius:999px; padding:10px 15px;
    font-size:14px; color:var(--txt); font-weight:600; animation:slideX .32s both var(--ease);
    transition:transform .14s var(--ease), background .14s ease, border-color .14s ease,
      color .14s ease, opacity .3s ease;}
  .rchip:active{background:var(--card2); transform:scale(.94);}
  .rchip.picked{background:var(--accent); border-color:var(--accent); color:#fff;
    animation:pickPop .42s var(--ease);}
  .rchip.dim{opacity:0; transform:translateX(calc(var(--dx) * .5)) scale(.92);}
  @keyframes pickPop{0%{transform:scale(1);} 35%{transform:scale(1.14);} 100%{transform:scale(1);}}
  input.item.flash{animation:inputFlash .6s var(--ease);}
  @keyframes inputFlash{
    0%{border-color:var(--accent); box-shadow:0 0 0 4px rgba(43,127,255,.28);}
    60%{border-color:var(--accent); box-shadow:0 0 0 2px rgba(43,127,255,.14);}
    100%{border-color:var(--line); box-shadow:none;}}
  .btn.ready{animation:readyPulse .5s var(--ease);}
  @keyframes readyPulse{0%{transform:scale(1);} 40%{transform:scale(1.025);} 100%{transform:scale(1);}}
  /* --- loading（中央にリング＋亀アイコンのパルス） --- */
  .loading{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .spinner{position:relative; width:76px; height:76px;}
  .spinner:before{content:''; position:absolute; inset:0; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite;}
  .spinner .spimg{position:absolute; inset:15px; width:46px; height:46px; border-radius:13px;
    animation:lpulse 1.5s var(--ease) infinite;}
  .ltext{color:var(--sub); font-size:13.5px; letter-spacing:.14em; animation:ldots 1.5s ease-in-out infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes lpulse{0%,100%{opacity:.75; transform:scale(.95);} 50%{opacity:1; transform:scale(1.05);}}
  @keyframes ldots{0%,100%{opacity:.5;} 50%{opacity:1;}}
  /* --- home --- */
  .home-hd{display:flex; align-items:center; gap:8px; padding:18px 2px 2px;}
  .home-hd .turtleimg{width:26px; height:26px; border-radius:7px; display:block;}
  .home-hd .turtle{font-size:26px; line-height:1; display:inline-block;}
  .home-hd .m{font-size:20px; font-weight:800; letter-spacing:.02em; line-height:1; display:inline-block;}
  /* ホーム本体: 支出と名言を画面の中央に置く */
  .homebody{flex:1; display:flex; flex-direction:column; justify-content:center; gap:54px; min-height:0;}
  .hero{text-align:center;}
  .hero .hlabel{font-size:12.5px; color:var(--sub); letter-spacing:.1em;}
  .hero .hvalue{font-size:52px; font-weight:800; line-height:1.05; margin:8px 0 22px;
    font-variant-numeric:tabular-nums; letter-spacing:-.015em;}
  .hbar{height:10px; border-radius:99px; overflow:hidden; display:flex; background:var(--card2); gap:2px;}
  .hbar span{height:100%; display:block; transition:width .7s var(--ease);}
  .hlegend{display:flex; gap:18px; margin-top:13px; justify-content:center;}
  .hlegend .lg{display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--txt);}
  .hlegend .dot{width:8px; height:8px; border-radius:99px; display:block;}
  /* 名言（心に刻む。金額ブロックと混ざらないよう、引用符で独立した塊に見せる） */
  .quote{text-align:center; padding:0 6px; position:relative;}
  .qmark{font-family:Georgia,'Times New Roman',serif; font-size:64px; line-height:.3;
    color:var(--faint); opacity:.5; height:30px; margin-bottom:8px; user-select:none;}
  .qtext{font-weight:700; letter-spacing:.03em; color:var(--txt); text-wrap:balance;
    line-height:1.72; font-size:24px;}
  .ph{white-space:nowrap;}          /* 文節の内部では改行させない */
  .homeadd{margin-top:auto; width:100%; border:none; border-radius:18px; padding:22px; font-size:20px;
    font-weight:800; background:var(--accent); color:#fff; display:flex; align-items:center;
    justify-content:center; gap:10px;}
  /* --- confirm --- */
  .rows{display:flex; flex-direction:column; gap:2px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; margin-top:2px;}
  .row{position:relative; display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line);
    animation:slideX .4s both var(--ease); transition:background .12s ease;}
  .row:active{background:var(--card2);}
  .rows .row:nth-child(1){animation-delay:.03s} .rows .row:nth-child(2){animation-delay:.07s}
  .rows .row:nth-child(3){animation-delay:.11s} .rows .row:nth-child(4){animation-delay:.15s}
  .rows .row:nth-child(5){animation-delay:.19s} .rows .row:nth-child(6){animation-delay:.23s}
  .rows .row:nth-child(7){animation-delay:.27s} .rows .row:nth-child(8){animation-delay:.31s}
  .row:last-child{border-bottom:none;}
  .row .l{font-size:13px; color:var(--sub); width:84px; flex:0 0 auto;}
  .row .v{font-size:17px; font-weight:700; flex:1; font-variant-numeric:tabular-nums;}
  .row .edit{color:var(--accent); font-size:13px;}
  .toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--ok); color:#04210f; font-weight:700; padding:12px 20px; border-radius:999px;
    opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; z-index:20; font-size:15px;}
  .toast.show{opacity:1; transform:translate(-50%,-6px);}
  .toast.err{background:#ff5c5c; color:#2a0000;}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>

<script>
/* ==== 実行モード ==============================================================
   本番(GitHub Pages)では Apps Script を fetch で叩く（トークン付き）。
   ローカル(localhost/file)ではモックで単体プレビューする。 */
var API_URL='https://script.google.com/macros/s/AKfycbwnXOOCaYZkc8fek5zonE4rhSk_bP6jNX7aNWUJf_iq-mmjWNDLIPG6bRBXgBPcOM9RpQ/exec';
var USE_LIVE=/(github\.io|githubusercontent)/.test(location.hostname) || /[?&]live=1/.test(location.search);
function getPin(){ return localStorage.getItem('wallet_pin')||''; }

/* Apps Script doPost を呼ぶ。Content-Type を付けない＝text/plain 扱いで CORS プリフライトを避ける。 */
function callApi(fn,payload){
  return fetch(API_URL,{ method:'POST', body:JSON.stringify({fn:fn,token:getPin(),payload:payload||{}}) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j&&j.error){ var er=new Error(j.error); if(j.error==='unauthorized'){ er.unauthorized=true; if(window.__onUnauthorized) window.__onUnauthorized(); } throw er; }
      return j;
    });
}

if (USE_LIVE) {
  /* ---- 本番: fetch で Apps Script を呼ぶ（google.script.run 互換） ---- */
  window.google={ script:{ run:(function(){
    function runner(){
      var h={s:null,f:null};
      function ok(v){ if(h.s) h.s(v); }
      function ng(e){ if(h.f) h.f(e); }
      var r={
        withSuccessHandler:function(f){h.s=f;return r;},
        withFailureHandler:function(f){h.f=f;return r;},
        getFormMeta:function(){ callApi('getFormMeta').then(ok,ng); },
        appendExpense:function(p){ callApi('appendExpense',p).then(ok,ng); },
        addTag:function(n){ callApi('addTag',{name:n}).then(function(j){ok(j.tags);},ng); },
        addMethod:function(n){ callApi('addMethod',{name:n}).then(function(j){ok(j.methods);},ng); }
      };
      return r;
    }
    return {
      withSuccessHandler:function(f){return runner().withSuccessHandler(f);},
      withFailureHandler:function(f){return runner().withFailureHandler(f);},
      getFormMeta:function(){return runner().getFormMeta();},
      appendExpense:function(p){return runner().appendExpense(p);},
      addTag:function(n){return runner().addTag(n);},
      addMethod:function(n){return runner().addMethod(n);}
    };
  })() } };
}

/* ---- google.script.run スタブ（ローカルプレビュー用） ---- */
if (typeof google === 'undefined' || !google.script) {
  window.google = { script:{ run:(function(){
    /* ローカル日付（toISOStringはUTCなのでJSTだと前日になる） */
    function localToday(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
    /* ★実シート(505件)の頻出品目をそのまま使用。架空データは使わない */
    /* シート側で統一された12種（サブスク表の実態＋日常系） */
    var mockTags=['外食','食料品','交通','サブスク','音楽','ビジネス','配信','娯楽','プレゼント','機材'];
    var mockMethods=['PayPay','Suica','三井住友','三菱UFJ','JCB','Freee','PayPal','Apple','現金'];
    var mockItemTags={'食材調達':'食料品','ルイボスS(DOUTOR)':'外食','ルイボスM(DOUTOR)':'外食',
      '外食(すき家/母)':'外食','外食(すき家/ひとり)':'外食','外食(大戸屋/ひとり)':'外食',
      '交通費(横浜)':'交通','交通費(和田町)':'交通','交通費(新杉田)':'交通',
      'Open AI API Credit':'サブスク','Spotify Premium':'サブスク','Kindle Unlimited':'サブスク',
      'Amazon Prime':'サブスク','YouTube Premium':'サブスク','Anytime Fitness':'サブスク'};
    var cb={}; var api={
      withSuccessHandler:function(f){cb.s=f;return api;},
      withFailureHandler:function(f){cb.f=f;return api;},
      getFormMeta:function(){ setTimeout(function(){ cb.s({
        monthName:'7月', sheetExists:true, today:localToday(),
        shito:['個人','社用'], hyoka:['投資','消費','浪費'],
        kanjo:['消耗品費','通信費','交際費','会議費','新聞図書費','地代家賃','個人'],
        methods:mockMethods.slice(),
        tags:mockTags.slice(), itemTags:mockItemTags,
        /* ★実シート分析: 3回以上採用 かつ サブスクシート掲載を除外した14件（実物と同じ） */
        recentItems:['食材調達','ルイボスS(DOUTOR)','外食(すき家/母)','交通費(横浜)','外食(すき家/ひとり)',
          '引越必要用品','Open AI API Credit','交通費(和田町)','交通費(新杉田)','外食(大戸屋/ひとり)',
          'ルイボスM(DOUTOR)','交通費(羽沢横浜国大)','Switch Bot 製品','外食(La Boheme/ひとり)'],
        totals:{sha:166361,koj:143933,toshi:52000,shohi:238294,rohi:20000}
      }); },250); },
      addTag:function(name){ setTimeout(function(){
        if(mockTags.indexOf(name)<0) mockTags.push(name);
        cb.s(mockTags.slice()); },200); },
      addMethod:function(name){ setTimeout(function(){
        if(mockMethods.indexOf(name)<0) mockMethods.push(name);
        cb.s(mockMethods.slice()); },200); },
      appendExpense:function(p){ setTimeout(function(){
        if(p.item&&p.tag) mockItemTags[p.item]=p.tag;
        cb.s({ok:true,monthName:'7月',
          totals:{sha:166361+(p.shito==='社用'?+p.price:0), koj:143933+(p.shito==='個人'?+p.price:0)},
          itemTags:mockItemTags}); },500); }
    }; return api;
  })() } };
}

/* ---- 状態 ---- */
var meta=null;
var data={ amount:'', item:'', tag:'', method:'', shito:'', kanjo:'', hyoka:'', date:'' };
var LABELS={amount:'金額',item:'品目',tag:'タグ',method:'支払方法',shito:'使途',kanjo:'勘定項目',hyoka:'評価'};

/* 日本語を文節っぽい塊へ分割する。
   改行してよいのは「句読点の後」と「助詞の後」だけ。塊の内部は改行禁止にするので、
   「正しいか間／違っている」のような単語の途中での分断が起きない。 */
/* 助詞として扱う字。「と」「か」「な」は語を壊すため除外
   （と→とき/ところ/とも、か→しかし、な→なければ 等） */
var PARTICLES='はがをにへでもやのば';
var PUNCT='、。！？';
function phraseChunks(s){
  var out=[], cur='';
  for(var i=0;i<s.length;i++){
    var c=s[i], nx=s[i+1]||'';
    cur+=c;
    if(nx==='') continue;
    var isPunct = PUNCT.indexOf(c)>=0;
    var isP = PARTICLES.indexOf(c)>=0 && cur.length>1;   /* 塊の先頭の「と」等は助詞ではない */
    var nextIsP = PARTICLES.indexOf(nx)>=0;
    var nextIsPunct = (PUNCT+'」』）').indexOf(nx)>=0;
    /* 「ではなく」「ではない」等の常用句は割らない */
    var glue = ['なく','ない','なら','なけ'].indexOf(s.substr(i+1,2))>=0;
    if(isPunct || (isP && !nextIsP && !nextIsPunct && !glue)){ out.push(cur); cur=''; }
  }
  if(cur) out.push(cur);
  return out;
}
function quoteHtml(s){
  return phraseChunks(s).map(function(p){
    return '<span class="ph">'+esc(p)+'</span>';
  }).join('');
}
/* 名言の字の大きさを決める。
   「全体の長さ」だけでなく「最長の塊が一行に収まるか」も見て、実際の幅から算出する。
   これで塊を割らずに（＝語の途中で改行せずに）、可能な限り大きく表示できる。 */
function fitQuote(s){
  var el=document.querySelector('.qtext');
  if(!el) return;
  var w=el.clientWidth || 480;
  var chunks=phraseChunks(s);
  var maxCh=1;
  chunks.forEach(function(p){ if(p.length>maxCh) maxCh=p.length; });
  var n=s.length;
  var byTotal = n<=22 ? 34 : (n<=40 ? 28 : (n<=62 ? 23 : 19));  /* 全体量からの上限 */
  var byChunk = Math.floor(w / (maxCh*1.08));                    /* 最長の塊が収まる上限 */
  var size=Math.max(14, Math.min(byTotal, byChunk, 34));
  el.style.fontSize=size+'px';
}

function inferIcon_(name){
  var s=String(name||'');
  for(var i=0;i<ICON_RULES.length;i++){ if(ICON_RULES[i][0].test(s)) return ICON_RULES[i][1]; }
  return 'tag';
}
function autoColor_(name){
  var s=String(name||''), h=0;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return AUTO_PALETTE[h % AUTO_PALETTE.length];
}

/** 🐢 と月名の「実際に描かれている部分」の中心を揃える。
 *  絵文字はベースラインより下にはみ出す（実測: 🐢は下に4px、7月は2px）ため、
 *  箱を中央寄せしただけでは見た目が下にずれる。
 *  canvas で各文字のインク範囲を実測し、要素の箱の中心からのズレを求めて打ち消す。
 *  端末ごとに絵文字フォントが違うので固定値にせず実行時に計算する。 */
function alignTurtle(){
  var t=document.querySelector('.home-hd .turtle'), m=document.querySelector('.home-hd .m');
  if(!t||!m) return;
  try{
    var ctx=document.createElement('canvas').getContext('2d');
    if(!ctx) return;
    /* 箱の中心を0としたときの「インク中心」の位置を返す（正=下） */
    function inkOffsetFromBoxCenter(el, txt){
      var cs=getComputedStyle(el);
      ctx.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
      var x=ctx.measureText(txt);
      if(x.actualBoundingBoxAscent===undefined || x.fontBoundingBoxAscent===undefined) return null;
      var box=el.getBoundingClientRect().height;
      var baselineFromTop=(box - (x.fontBoundingBoxAscent + x.fontBoundingBoxDescent))/2 + x.fontBoundingBoxAscent;
      var inkCenterFromTop=baselineFromTop + (x.actualBoundingBoxDescent - x.actualBoundingBoxAscent)/2;
      return inkCenterFromTop - box/2;
    }
    t.style.transform='';   /* 前回の補正を外してから測る */
    var a=inkOffsetFromBoxCenter(t, t.textContent||'🐢');
    var b=inkOffsetFromBoxCenter(m, m.textContent||'7月');
    if(a===null||b===null||!isFinite(a)||!isFinite(b)) return;
    t.style.transform='translateY('+(b-a).toFixed(2)+'px)';
  }catch(e){}
}

/* ---- 電卓（四則演算・×÷優先） ---- */
var calcExpr='';
var BKSP='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-10.5a1 1 0 0 1 -.7 -.3l-4.8 -4.8a1.3 1.3 0 0 1 0 -1.8l4.8 -4.8a1 1 0 0 1 .7 -.3z"/><path d="M12 10.5l3 3m0 -3l-3 3"/></svg>';
function evalExpr(s){
  if(!s) return 0;
  var toks=String(s).match(/(\d+\.?\d*|[+\-−×÷])/g);
  if(!toks) return 0;
  toks=toks.slice();
  while(toks.length && /[+\-−×÷]/.test(toks[toks.length-1])) toks.pop();
  if(!toks.length) return 0;
  var p=[toks[0]];
  for(var i=1;i<toks.length;i+=2){
    var op=toks[i], n=toks[i+1];
    if(n===undefined) break;
    if(op==='×') p[p.length-1]=String(Number(p[p.length-1])*Number(n));
    else if(op==='÷') p[p.length-1]=String(Number(n)===0?0:Number(p[p.length-1])/Number(n));
    else { p.push(op); p.push(n); }
  }
  var r=Number(p[0])||0;
  for(var j=1;j<p.length;j+=2){
    var o=p[j], m=Number(p[j+1])||0;
    if(o==='+') r+=m; else if(o==='-'||o==='−') r-=m;
  }
  return isFinite(r)?r:0;
}
function calcKey(k){
  if(k==='C') calcExpr='';
  else if(k==='back') calcExpr=calcExpr.slice(0,-1);
  else if(k==='='){ var r=evalExpr(calcExpr); calcExpr=(r>0)?String(Math.round(r)):''; }
  else if(k==='+'||k==='−'||k==='×'||k==='÷'){
    if(!calcExpr) return;                                        /* 先頭に演算子は置かない */
    if(/[+\-−×÷]$/.test(calcExpr)) calcExpr=calcExpr.slice(0,-1)+k;  /* 連続演算子は置換 */
    else calcExpr+=k;
  } else { calcExpr+=k; }                                        /* 数字・00 */
  if(calcExpr.length>24) calcExpr=calcExpr.slice(0,24);
  vib(8); updateCalc();
}
function updateCalc(){
  var e=document.getElementById('expr'), v=document.getElementById('amt'), b=document.getElementById('nextBtn');
  if(!e) return;
  var r=Math.round(evalExpr(calcExpr)); var pos=r>0;
  e.textContent=calcExpr||'0';
  var nt=pos?fy(r):'0';
  if(v.textContent!==nt){ v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump'); }
  v.textContent=nt; v.classList.toggle('empty',!pos);
  if(b) b.disabled=!pos;
}

    document.getElementById('nextBtn').disabled=!this.value.trim();
    renderSuggest(this.value);
  });
  renderSuggest(data.item);
  setTimeout(function(){ inp.focus(); },80);
}
/* 入力に対する過去品目の類似候補（表記ゆれ防止＝同じワードに揃える） */
function similarItems(q, n){
  var pool=meta.recentItems||[]; var lq=String(q).trim().toLowerCase();
  if(!lq) return [];
  var starts=[], inc=[];
  pool.forEach(function(t){
    var lt=String(t).toLowerCase();
    if(lt===lq) return;                       /* 完全一致は候補に出さない */
    if(lt.indexOf(lq)===0) starts.push(t);
    else if(lt.indexOf(lq)>=0) inc.push(t);
  });
  return starts.concat(inc).slice(0, n||6);
}
function renderSuggest(q){
  if(!SUGGEST_ENABLED) return;              /* 候補は一旦オフ */
  var rec=document.getElementById('rec'); if(!rec) return;
  rec.innerHTML='';
  var hits=similarItems(q, 6);                /* 入力してから・似た候補があるときだけ出す */
  hits.forEach(function(t){
    var c=document.createElement('div'); c.className='rchip'; c.textContent=t;
    c.onclick=function(){ setItem(t, c); };
    rec.appendChild(c);
  });
}
/* 候補を選んだときの演出: 押した候補が確定色に光り、他は静かに消え、入力欄が受け取る */
function setItem(t, el){
  if(pickingItem) return;
  pickingItem=true;
  data.item=t;
  var tg=(meta.itemTags||{})[t];            /* 過去に同じ品目で選んだタグを引き継ぐ */
  if(tg){ data.tag=tg; tagInherited=true; } /* 引き継いだらタグ選択は飛ばす（確認画面で変更可） */
  vib(12);

  if(el){
    el.classList.add('picked');
    [].forEach.call(document.querySelectorAll('.rchip'), function(c){
      if(c!==el) c.classList.add('dim');
    });
  }
  var inp=document.getElementById('itm');
  if(inp){
    inp.value=t;
    inp.classList.remove('flash'); void inp.offsetWidth; inp.classList.add('flash');
  }
  var b=document.getElementById('nextBtn');
  if(b){ b.disabled=false; b.classList.remove('ready'); void b.offsetWidth; b.classList.add('ready'); }

  setTimeout(function(){ pickingItem=false; renderSuggest(t); }, 460);
}
var pickingItem=false;
function commitItem(){ var v=document.getElementById('itm').value.trim(); if(!v) return; data.item=v; next(); }

/* 支払方法: よく使う3つだけ出し、残りは「詳細オプション」に隠す */
var PRIMARY_METHODS=['三井住友','三菱UFJ','PayPay','現金'];
var methodExpanded=false;
function renderMethod(){
  var all=meta.methods||[];
  var primary=PRIMARY_METHODS.filter(function(v){ return all.indexOf(v)>=0; });
  var others=all.filter(function(v){ return primary.indexOf(v)<0; });
  /* 既に主要以外が選ばれている場合は開いた状態で出す（戻ってきたとき選択が見えるように） */
  var open = methodExpanded || (data.method && primary.indexOf(data.method)<0);
  var html=primary.map(function(v){ return choiceHtml('method', v); }).join('');
  if(open){
    html+=others.map(function(v){ return choiceHtml('method', v); }).join('');
    html+='<div class="choice newtag" onclick="showAddMethod()"><span>＋ 新しい支払方法</span></div>';
  }
  paint(
    navbar(LABELS.method, true)+
    '<div class="q">支払方法を選ぶ</div>'+
    '<div class="body">'+
      '<div class="choices'+(open&&all.length>5?' grid2':'')+'">'+html+'</div>'+
      '<div id="addMethodBox"></div>'+
      (open ? '' : '<button class="btn ghost more" onclick="expandMethods()">詳細オプション</button>')+
    '</div>');
}
function expandMethods(){ methodExpanded=true; navDir='fwd'; render(); }
function showAddMethod(){
  var box=document.getElementById('addMethodBox');
  box.innerHTML='<div class="addrow">'+
    '<input class="item" id="newMethod" type="text" placeholder="支払方法の名前" autocomplete="off">'+
    '<button class="btn compact" onclick="commitAddMethod()">追加</button></div>';
  var i=document.getElementById('newMethod');
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') commitAddMethod(); });
  setTimeout(function(){ i.focus(); },60);
}
function commitAddMethod(){
  var el=document.getElementById('newMethod'); if(!el) return;
  var v=el.value.trim(); if(!v) return;
  google.script.run
    .withSuccessHandler(function(list){ meta.methods=list; data.method=v; vib(15); next(); })
    .withFailureHandler(function(e){ toast('追加できません: '+(e&&e.message?e.message:e), true); })
    .addMethod(v);
}

/* タグ（任意項目）: 選ぶ / 追加する / スキップ */
function renderTag(){
  var list=meta.tags||[];
  var items=list.map(function(v){ return choiceHtml('tag', v); }).join('');
  items+='<div class="choice newtag" onclick="showAddTag()"><span>＋ 新しいタグ</span></div>';
  var two=(list.length+1)>6;
  paint(
    navbar(LABELS.tag, true)+
    '<div class="q">タグを選ぶ</div>'+
    '<div class="body">'+
      '<div class="choices'+(two?' grid2':'')+'">'+items+'</div>'+
      '<div id="addTagBox"></div>'+
    '</div>');
}
function showAddTag(){
  var box=document.getElementById('addTagBox');
  box.innerHTML='<div class="addrow">'+
    '<input class="item" id="newTag" type="text" placeholder="タグ名" autocomplete="off">'+
    '<button class="btn compact" onclick="commitAddTag()">追加</button></div>';
  var i=document.getElementById('newTag');
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') commitAddTag(); });
  setTimeout(function(){ i.focus(); },60);
}
function commitAddTag(){
  var el=document.getElementById('newTag'); if(!el) return;
  var v=el.value.trim(); if(!v) return;
  google.script.run
    .withSuccessHandler(function(list){ meta.tags=list; data.tag=v; vib(15); next(); })
    .withFailureHandler(function(e){ toast('追加できません: '+(e&&e.message?e.message:e), true); })
    .addTag(v);
}

function renderChoice(field, list, q){
  list=list||[];
  var two=list.length>6;                       /* 項目が多いときは2列で収める */
  var items=list.map(function(v){ return choiceHtml(field, v); }).join('');
  paint(
    navbar(LABELS[field], true)+
    '<div class="q">'+q+'</div>'+
    '<div class="body"><div class="choices'+(two?' grid2':'')+'">'+items+'</div></div>');
}

/* アイコン＋識別色つきの選択カード */
function choiceHtml(field, v){
  var st=styleOf(v), on=data[field]===v;
  return '<div class="choice'+(on?' on':'')+'" style="--c:'+st.c+'" '+
    'onclick="pick(\''+field+'\',\''+esc(v).replace(/'/g,"\\'")+'\')">'+
    iconSvg(st.i)+'<span>'+esc(v)+'</span><span class="tick">✓</span></div>';
}

function renderConfirm(){
  var personalKanjo = (data.shito==='個人');   // 個人は勘定項目=個人で固定・編集不可
  var rowsList=[
    ['amount','金額','¥'+fy(data.amount),true],
    ['item','品目',esc(data.item),true],
    ['tag','タグ',data.tag?esc(data.tag):'—',true],
    ['method','支払方法',esc(data.method),true],
    ['shito','使途',esc(data.shito),true],
    ['kanjo','勘定項目',esc(data.kanjo),!personalKanjo],
    ['hyoka','評価',esc(data.hyoka),true]
  ];
  var rows=rowsList.map(function(r){
    var editable=r[3];
    return '<div class="row"'+(editable?' onclick="editField(\''+r[0]+'\')"':'')+'>'+
      '<span class="l">'+r[1]+'</span><span class="v">'+r[2]+'</span>'+
      (editable?'<span class="edit">変更</span>':'')+'</div>';
  }).join('');
  var dateRow='<div class="row" onclick="openDate(event)">'+
    '<span class="l">日付</span>'+
    '<span class="v" id="dtLabel">'+dateLabel(data.date)+'</span>'+
    '<input type="date" id="dt" value="'+data.date+'" onchange="onDateChange(this.value)" '+
      'style="position:absolute; left:18px; bottom:6px; opacity:0; width:1px; height:1px; pointer-events:none;">'+
    '<span class="edit" id="todayBtn">今日</span></div>';
  paint(
    navbar('確認', true)+
    '<div class="q">これで記録する？</div>'+
    '<div class="body"><div class="rows">'+rows+dateRow+'</div></div>'+
    '<div class="foot"><button class="btn" id="saveBtn" onclick="save()">記録する</button></div>');
  document.getElementById('todayBtn').onclick=function(ev){ ev.stopPropagation();
    data.date=meta.today; document.getElementById('dt').value=meta.today;
    document.getElementById('dtLabel').textContent=dateLabel(meta.today); };
}
function dateLabel(iso){
  if(!iso) return '—';
  var p=iso.split('-'); var wd=['日','月','火','水','木','金','土'];
  var d=new Date(iso+'T00:00:00');
  return p[0]+'/'+p[1]+'/'+p[2]+'（'+wd[d.getDay()]+'）';
}
function openDate(e){
  if(e && e.target && e.target.id==='todayBtn') return;
  var el=document.getElementById('dt');
  try{ el.showPicker(); }catch(_){ el.focus(); el.click(); }
}
function onDateChange(v){ data.date=v; var l=document.getElementById('dtLabel'); if(l) l.textContent=dateLabel(v); }
function editField(f){ editReturn=true; go(f); }

function save(){
  var btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='記録中…';
  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.totals) meta.totals=res.totals;
      if(res&&res.itemTags) meta.itemTags=res.itemTags;   /* 品目→タグ の記憶を最新化 */
      vib(30); celebrate();
    })
    .withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='記録する';
      toast('失敗: '+(err&&err.message?err.message:err), true);
    })
    .appendExpense({date:data.date||meta.today, item:data.item, price:data.amount,
      tag:data.tag, method:data.method, shito:data.shito, kanjo:data.kanjo, hyoka:data.hyoka});
}
function celebrate(){
  navDir='fwd';
  app.innerHTML='<div class="screen"><div class="success">'+
    '<svg class="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>'+
    '<div class="stitle">記録しました</div>'+
    '<div class="ssub">¥'+fy(data.amount)+'　'+esc(data.item)+'</div>'+
  '</div></div>';
  setTimeout(function(){ go('home'); }, 1300);
}

/* ---- 起動 ---- */
function renderLoading(){
  app.innerHTML=
    '<div class="loading">'+
      '<div class="spinner"><img class="spimg" src="icon-192.png" alt=""></div>'+
      '<div class="ltext">読み込み中</div>'+
    '</div>';
}
function bootApp(){
  renderLoading();
  google.script.run.withSuccessHandler(function(m){
    meta=m;
    if(!meta.methods) meta.methods=['PayPay','Suica','三井住友','三菱UFJ','JCB','Freee','PayPal','Apple','現金'];
    if(!meta.tags) meta.tags=['外食','食料品','交通','サブスク','音楽','ビジネス','配信','娯楽','プレゼント','機材'];
    if(!meta.itemTags) meta.itemTags={};
    data.date=m.today; go('home');
  }).withFailureHandler(function(e){
    if(e&&e.unauthorized){ renderSetup('PINが正しくありません。もう一度入力してください。'); return; }
    app.innerHTML='<div class="q" style="margin-top:40px">読込に失敗しました</div><div class="qsub">'+esc((e&&e.message)||e)+'</div>';
  }).getFormMeta();
}

/* 初回だけ PIN を入力してもらい端末に保存する（本番のみ）。公開ソースに秘密を置かないための仕組み。 */
function renderSetup(msg){
  app.innerHTML=
    '<div class="navbar"><div class="back hidden">‹</div><div class="steplabel">初期設定</div></div>'+
    '<div class="body">'+
      '<div class="q">アプリのPINを入力</div>'+
      '<div class="qsub">最初の1回だけ。この端末に保存され、次回からは不要です。</div>'+
      (msg?'<div class="qsub" style="color:#ff7a59">'+esc(msg)+'</div>':'')+
      '<input class="item" id="pinin" type="password" inputmode="text" autocomplete="off" placeholder="PIN">'+
    '</div>'+
    '<div class="foot"><button class="btn" id="pinsave">保存して開始</button></div>';
  var inp=document.getElementById('pinin');
  function save(){ var v=(inp.value||'').trim(); if(!v) return; localStorage.setItem('wallet_pin',v); bootApp(); }
  document.getElementById('pinsave').onclick=save;
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') save(); });
  setTimeout(function(){ inp.focus(); },100);
}
window.__onUnauthorized=function(){ renderSetup('PINが正しくありません。もう一度入力してください。'); };

if(USE_LIVE && !getPin()) renderSetup(''); else bootApp();
</script>
